name: integration-soak

on:
  push:
    branches:
      - integration

permissions:
  contents: read

env:
  # This value is the GitHub App installation ID for the trusted soak check.
  # The provider binds the check run to this ID; the workflow cannot choose its
  # own check-run app identity.
  AVO_INTEGRATION_SOAK_APP_ID: "15368"
  AVO_TRUSTED_SOAK_WORKFLOW_SHA256: ${{ vars.AVO_TRUSTED_SOAK_WORKFLOW_SHA256 }}

jobs:
  integration-soak:
    name: avo integration soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify trusted base workflow blob
        shell: bash
        run: |
          set -euo pipefail
          expected="${AVO_TRUSTED_SOAK_WORKFLOW_SHA256:-}"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "AVO_TRUSTED_SOAK_WORKFLOW_SHA256 must be a lowercase 64-hex repository variable" >&2
            exit 1
          fi
          actual="$(git show "$GITHUB_SHA:.github/workflows/integration-soak.yml" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Fail only for the exact AVO live-rollback marker
        shell: bash
        run: |
          set -euo pipefail
          marker_path='docs/avo-0046-live-rollback-canary.txt'
          marker='AVO-Live-Rollback-Marker: fail-soak'
          marker_digest='84e940a02be358b4d7abc4d6fb1b83b723adce8fbd0feaa8c193919a0e28a318'
          # The marker is intentionally a candidate-tree fact, rather than a
          # squash commit-message fact.  This survives GitHub's merge API,
          # while the exact path/content binding remains in candidate
          # provenance and changed-path evidence.  Symlinks and malformed
          # content fail closed instead of being interpreted as a trigger.
          if [[ -e "$marker_path" || -L "$marker_path" ]]; then
            lines="$(wc -l < "$marker_path" | tr -d '[:space:]')"
            actual_marker_digest="$(sha256sum "$marker_path" | awk '{print $1}')"
            if [[ -L "$marker_path" || ! -f "$marker_path" || "$lines" -ne 1 || "$actual_marker_digest" != "$marker_digest" ]] || ! grep -Fqx "$marker" "$marker_path"; then
              echo "live-rollback marker path exists but is not the exact standalone marker" >&2
              exit 1
            fi
            echo "deterministic AVO live-rollback soak failure"
            exit 1
          fi
          echo "integration soak passed"
